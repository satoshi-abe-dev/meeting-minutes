# CI:
#   tests … pytest を Linux/Windows/macOS で（Issue #8）
#   lint  … ruff・mypy を Linux で（Issue #9）
#
# tkinter/画面非依存（GUIロジックもFakeMainView経由）。Xvfb等は不要。
# needs_ffmpeg は無い環境で自動skip。needs_llm は将来用の未使用マーカー。
# よって CI に ffmpeg/LLM は不要。
name: CI

on:
  push:
    branches: [main] # main に入った後に流す
  pull_request:
    branches: [main] # main 向け PR を、マージ前にブランチの状態で流す

jobs:
  tests:
    strategy:
      fail-fast: false # 1 OS が落ちても他をキャンセルせず、全 OS の結果を見る
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5 # リポジトリをランナーへチェックアウトする

      - uses: actions/setup-python@v6 # 指定バージョンの Python を入れて PATH を通す
        with:
          # docs/setup_ja.md は「3.11 以上（動作確認は 3.14 系）」。最低ラインの
          # 検証も兼ねて 3.11 を軸にする。
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # python3 でなく python（Windows に python3 は無い）。-ra で skip 理由を表示。
      - name: Run pytest
        run: python -m pytest -ra

  # ruff / mypy の結果は OS に依らないので Linux 1 本だけ。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: python -m ruff check src tests

      - name: mypy (type check)
        run: python -m mypy
