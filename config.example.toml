# Copy this file to config.toml and edit it for your environment.
# config.toml is gitignored (personal config, never committed).
#
#   cp config.example.toml config.toml
#
# Every value can also be set via an environment variable (e.g. MM_AI_BASE_URL).

# --------------------------------------
[transcribe]

# Model size: large-v3-turbo (default, fast) / large-v3 / medium / small.
# Or a full HF repo name.
model = "large-v3-turbo"

# "auto" (mlx on Apple Silicon, else faster-whisper) / "mlx" / "faster-whisper"
backend = "auto"

# faster-whisper only (ignored by mlx).
compute_type = "int8"
device = "auto"

# Meeting's language. Empty "" auto-detects.
language = "ja"

# --------------------------------------
[frames]

# Seconds between captured frames.
interval_sec = 15

# Scene-change sensitivity (0.0-1.0, lower = more sensitive).
scene_threshold = 0.3

# Cap on VLM calls; frames are thinned past this.
max_frames = 60

# Min gap between nearby frames.
min_gap_sec = 4

# --------------------------------------
[ai]

# OpenAI-compatible endpoint. LM Studio's default, or Ollama: "http://localhost:11434/v1"
base_url = "http://localhost:1234/v1"

# Unused but required by OpenAI-compatible clients.
api_key = "local-no-key"

# Analyzes frame (screenshot) images.
vlm_model = "qwen2-vl-7b-instruct"

# Avoid reasoning models (Qwen3, DeepSeek-R1) — extremely slow, can return
# an empty body. See docs/models_en.md.
llm_model = "qwen2.5-7b-instruct"

# Seconds; raise for slow/large models.
timeout = 600

# Response cap; raise if the body comes back empty.
max_tokens = 8192

# Character-count fallback when the real context length can't be
# auto-detected. Lower both if you can't raise Context Length past 32768.
# Switches to chunked generation above chunk_trigger_chars; chunk_size_chars
# is the characters per chunk.
chunk_trigger_chars = 20000
chunk_size_chars = 12000

# Loaded model's context length in tokens; 0 = auto-detect.
context_tokens = 0

# --------------------------------------
[output]

# Written to output/<video name>/.
dir = "output"

# Custom template for the minutes structure. Empty = built-in.
# Placeholders: {title} {datetime_hint} {duration_hint} {transcript} {frames}
template_path = ""

# "Auto" mode: LLM generates the heading structure from the video content.
# Takes priority over template_path when true.
auto_structure = false

# Minutes' output language. Default "ja". Independent of [transcribe]
# language and [gui] language. Frame descriptions (VLM) always follow the
# recording's own detected language, not this setting.
minutes_language = "ja"

# --------------------------------------
[gui]

# GUI text: "ja" / "en" (default). Override once via --lang.
language = "en"

# --------------------------------------
