# pytest の設定だけを置く最小構成。パッケージング（build-system 等）は行わない。
[tool.pytest.ini_options]
# src レイアウト（PyPA 推奨）。パッケージをリポジトリ直下ではなく src/ 配下に置く
# ことで、フラットレイアウトだと起こりがちな「テストがカレントディレクトリ経由で
# 生のソースを偶然 import できてしまう」状態に依存せず、実際にインストールされた
# 形に近い状態で動作確認できる。テストからは pythonpath 経由で src/ を通す。
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "needs_ffmpeg: 実物の ffmpeg を呼ぶ。ffmpeg が無ければ skip",
    "needs_llm: 実物のローカル LLM サーバー（LM Studio 等）を呼ぶ。無ければ skip",
]
