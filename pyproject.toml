# pytest の設定だけを置く最小構成。パッケージング（build-system 等）は行わない。
[tool.pytest.ini_options]
# src レイアウト（PyPA 推奨）。フラットレイアウトだとテストがカレント経由で
# 生ソースを偶然 import できてしまうが、それに依存せずインストール済み相当で
# 検証できる。テストからは pythonpath 経由で src/ を通す。
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "needs_ffmpeg: 実物の ffmpeg を呼ぶ。ffmpeg が無ければ skip",
    "needs_llm: 実物のローカル LLM サーバー（LM Studio 等）を呼ぶ。無ければ skip",
]

# --- lint（ruff）------------------------------------------------------------
[tool.ruff]
target-version = "py311"  # docs/setup_ja.md の最低ライン
# 日本語コメント・文字列が全角で入るぶん、行が実測より短く見える。80/88 だと
# 「見た目は収まっているのに違反」が大量に出るので、少し広めの 110 にする。
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes（基本）。I: import 並べ替え。UP: 新しい構文へ。
# B: bugbear（バグになりやすい書き方）。C4: 内包表記。SIM: 冗長な条件の簡約。
# RUF: ruff 固有。
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003（ambiguous-unicode）は日本語の全角記号を誤検知するため無効化
# （個別 noqa だと数百箇所になり非現実的）。
ignore = ["RUF001", "RUF002", "RUF003"]

# --- 型チェック（mypy）---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
# サードパーティ（faster-whisper / mlx-whisper / httpx の一部）は型スタブが無い。
# 「import が解決できない」だけのエラーは黙らせ、自コードの型不整合に集中する。
ignore_missing_imports = true
# 段階導入。まずは明確な型エラーだけ拾い、no-untyped-def 等の厳格化は後続で。
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# numpy同梱スタブが3.12+構文を使い python_version=3.11 で落ちるため、
# 直接依存しない numpy は解析対象外にする。
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# tk_main_window.py は Tkinter アダプタ。`grid(**pad)` 等の dict 展開が
# tkinter スタブと噛み合わず arg-type を量産する（既知の相性問題）ため、この
# ファイルのみ arg-type 無効化。他のチェックは有効のまま。
[[tool.mypy.overrides]]
module = "meeting_minutes.view.tk_main_window"
disable_error_code = ["arg-type"]
